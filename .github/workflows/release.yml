name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Build app bundle
        run: make app

      - name: Zip
        run: cd build && zip -r AvilaVoice.zip AvilaVoice.app

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: build/AvilaVoice.zip
          generate_release_notes: true
